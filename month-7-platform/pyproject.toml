[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-mastery-platform"
version = "0.8.1"
description = "Unified FDE AI platform capstone"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
quality = ["ruff>=0.6", "mypy>=1.11"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
redis = ["redis>=5.0"]

[tool.setuptools]
py-modules = ["schemas", "observability", "domain_agent"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "deployment*",
  "persistence*",
  "shared_orchestrator*",
  "integrations*",
  "observability*",
  "security*",
  "client_onboarding*",
  "golden_datasets*",
  "demo*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
