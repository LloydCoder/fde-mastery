[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-mastery-platform"
version = "1.6.0"
description = "Unified FDE AI platform capstone"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "anthropic>=0.70",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "PyJWT[crypto]>=2.9",
  "requests>=2.32",
  "opentelemetry-api>=1.39",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
quality = ["ruff>=0.6", "mypy>=1.11"]
security = ["bandit>=1.7", "pip-audit>=2.7", "cyclonedx-bom>=7.0"]
redis = ["redis>=5.0"]
secrets = ["boto3>=1.35", "hvac>=2.3"]
observability = [
  "opentelemetry-sdk>=1.39",
  "opentelemetry-exporter-otlp>=1.39",
  "opentelemetry-instrumentation-fastapi>=0.60b1",
]
sbom = ["cyclonedx-bom>=7.0"]

[tool.setuptools]
py-modules = ["schemas", "observability_metrics", "config", "domain_agent"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "fde_platform*",
  "deployment*",
  "persistence*",
  "shared_orchestrator*",
  "integrations*",
  "security*",
  "client_onboarding*",
  "golden_datasets*",
  "demo*",
  "observability*",
  "evaluation*",
  "domains*",
  "custom_agents*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
