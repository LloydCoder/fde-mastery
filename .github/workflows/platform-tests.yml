name: Platform Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify workflow
        run: echo "Platform Quality workflow loaded"
      - name: Verify Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install platform
        working-directory: month-7-platform
        env:
          FDE_STORAGE_BACKEND: memory
          FDE_RATE_LIMIT_BACKEND: memory
          FDE_MONTH1_PROVIDER: mock
          MOCK_LLM: "true"
          FDE_ENVIRONMENT: test
          OTEL_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e ".[test,quality,security,redis,observability,sbom]"
          pip check
      - name: Unit and integration tests
        working-directory: month-7-platform
        env:
          FDE_STORAGE_BACKEND: memory
          FDE_RATE_LIMIT_BACKEND: memory
          FDE_MONTH1_PROVIDER: mock
          MOCK_LLM: "true"
          FDE_ENVIRONMENT: test
          OTEL_ENABLED: "false"
        run: python -m pytest -q
      - name: Six-domain registration
        working-directory: month-7-platform
        env:
          FDE_MONTH1_PROVIDER: mock
          MOCK_LLM: "true"
          FDE_ENVIRONMENT: test
        run: python -c "from shared_orchestrator.router import AgentRouter; r=AgentRouter(); r.register_defaults(); assert set(r.list_domains()) == {'cybersecurity','finance','healthtech','logistics','legal','revops'}; r.close()"
      - name: Compile
        working-directory: month-7-platform
        run: python -m compileall -q .
