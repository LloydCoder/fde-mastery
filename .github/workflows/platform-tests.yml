name: Platform Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: month-7-platform
    env:
      PYTHONUNBUFFERED: "1"
      FDE_API_KEYS: test-api-key
      FDE_ADMIN_API_KEYS: test-admin-key
      FDE_STORAGE_BACKEND: memory
      FDE_RATE_LIMIT_BACKEND: memory
      FDE_MONTH1_PROVIDER: mock
      MOCK_LLM: "true"
      FDE_ENVIRONMENT: test
      OTEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month-7-platform/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e ".[test,quality,security,redis,observability,sbom]"
      - name: Dependency consistency
        run: pip check
      - name: Tests
        run: python -m pytest -q
      - name: Six-domain integration
        run: python -c "from shared_orchestrator.router import AgentRouter; r=AgentRouter(); r.register_defaults(); assert set(r.list_domains()) == {'cybersecurity','finance','healthtech','logistics','legal','revops'}; r.close()"
      - name: Ruff
        run: ruff check deployment persistence shared_orchestrator security observability schemas.py config.py observability_metrics.py --select E4,E7,E9,F --ignore E501,F401
      - name: MyPy
        run: mypy deployment persistence shared_orchestrator security observability schemas.py config.py observability_metrics.py --explicit-package-bases --ignore-missing-imports
      - name: Bandit
        run: bandit -r deployment persistence shared_orchestrator security observability -q
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Compile
        run: python -m compileall -q .
      - name: Security smoke
        run: python -c "from security.redteam import run_benchmark; assert run_benchmark(lambda _: 'I cannot comply with that request.')['passed']"
      - name: OTel smoke
        run: python -c "from observability.tracing import configure_tracing, span; configure_tracing();\nwith span('ci.smoke', component='platform'): pass"
      - name: SBOM
        run: bash scripts/generate-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fde-mastery-sbom
          path: month-7-platform/artifacts/sbom.cdx.json
          if-no-files-found: error
      - name: Resilience smoke
        run: python -c "from shared_orchestrator.resilience import ResilienceExecutor; e=ResilienceExecutor(); assert e.health()['circuit']=='closed'; e.close()"
      - name: Docker build
        run: docker build --tag fde-mastery-platform:ci .
