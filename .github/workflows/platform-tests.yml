name: Platform Quality

on:
  push:
    branches:
      - main
      - 'build-*'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test-quality:
    name: Test, Security and Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packages/platform-core
    env:
      PYTHONUNBUFFERED: "1"
      FDE_STORAGE_BACKEND: memory
      FDE_RATE_LIMIT_BACKEND: memory
      FDE_MONTH1_PROVIDER: mock
      MOCK_LLM: "true"
      FDE_ENVIRONMENT: test
      FDE_SECRETS_BACKEND: environment
      OTEL_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/platform-core/pyproject.toml
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Install platform and CI tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,quality,security,redis,observability,sbom]"
          python -m pip check
      - name: Run test suite
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Verify all seven domain adapters
        run: |
          python - <<'PY'
          from shared_orchestrator.router import AgentRouter
          from schemas import Domain
          router = AgentRouter()
          try:
              router.register_defaults()
              expected = {d.value for d in Domain}
              actual = set(router.list_domains())
              assert actual == expected, (actual, expected)
              assert all(v["agent"]["status"] == "ready" for v in router.health().values())
          finally:
              router.close()
      - name: Verify enterprise deployment gates
        run: python -m pytest -q tests/test_enterprise_readiness.py tests/test_action_guard_and_shadow.py tests/test_golden_dataset.py tests/test_procurement_and_custom.py tests/test_custom_agent_tool_gateway.py
      - name: Verify P0-P2 platform controls
        run: python -m pytest -q tests/test_enterprise_platform.py
      - name: Generate and validate golden dataset manifest
        run: |
          python -m evaluation.generate_golden
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path("evaluation/golden/generated-v1.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert len(rows) == 700, len(rows)
          assert {row["domain"] for row in rows} == {"cybersecurity", "finance", "healthtech", "logistics", "legal", "revops", "procurement"}
          assert len({row["id"] for row in rows}) == 700
          PY
      - name: Run AI security regression suite
        run: |
          python - <<'PY'
          from security.redteam import load_corpus, run_benchmark
          def safe_responder(_prompt: str) -> str:
              return "Request rejected by policy. No protected information or privileged action was provided."
          result = run_benchmark(safe_responder, load_corpus())
          assert result["total"] >= 4, result
          assert result["failed"] == 0, result
          assert result["passed"] is True, result
          PY
      - name: Validate enterprise security controls
        run: python -m pytest -q tests/test_enterprise_controls.py tests/test_chaos_controls.py
      - name: Validate migration sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("persistence/migrations").glob("[0-9][0-9][0-9]_*.sql"))
          assert files, "No SQL migrations found"
          versions = [int(re.match(r"^(\d{3})_", f.name).group(1)) for f in files]
          assert versions == list(range(1, len(versions) + 1)), versions
          PY
      - name: Ruff
        run: python -m ruff check security persistence shared_orchestrator deployment evaluation integrations domains custom_agents fde_platform tests --select E4,E7,E9,F --ignore E501,F401
      - name: MyPy typed platform core
        run: |
          set -o pipefail
          python -m mypy security persistence shared_orchestrator deployment evaluation integrations domains custom_agents fde_platform --explicit-package-bases --ignore-missing-imports 2>&1 | tee artifacts/mypy.txt
      - name: Bandit
        run: python -m bandit -r security persistence shared_orchestrator deployment evaluation integrations domains custom_agents fde_platform -q
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: Compile source tree
        run: python -m compileall -q security persistence shared_orchestrator deployment evaluation integrations domains custom_agents fde_platform ../../platformctl ../../apps/worker
      - name: Validate platform CLI
        run: |
          cd ../..
          PYTHONPATH=packages/platform-core python -m platformctl doctor
          PYTHONPATH=packages/platform-core python -m platformctl manifest
      - name: Terraform format and validation
        working-directory: packages/platform-core/deployment/terraform
        run: |
          terraform fmt -recursive
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh
      - name: Validate SBOM
        run: |
          test -s artifacts/sbom.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("artifacts/sbom.cdx.json").read_text())
          assert doc.get("bomFormat") == "CycloneDX"
          assert doc.get("components") is not None
          PY
      - name: Start staging API for load smoke
        run: |
          nohup python -m uvicorn deployment.api_gateway.main:app --host 127.0.0.1 --port 8000 > artifacts/uvicorn.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8000/health && break || sleep 1; done
      - name: Load smoke
        run: python scripts/load_smoke.py --url http://127.0.0.1:8000/health --requests 50
      - name: Upload diagnostics and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-quality-artifacts
          path: |
            packages/platform-core/artifacts/pytest.xml
            packages/platform-core/artifacts/mypy.txt
            packages/platform-core/artifacts/sbom.cdx.json
            packages/platform-core/artifacts/uvicorn.log
            packages/platform-core/evaluation/golden/generated-v1.jsonl
          if-no-files-found: warn
      - name: Production Docker build and runtime smoke
        run: |
          docker build --tag fde-mastery-platform:ci .
          docker run --detach --name fde-mastery-platform-ci --publish 18000:8000 \
            --env FDE_ENVIRONMENT=test \
            --env FDE_STORAGE_BACKEND=memory \
            --env FDE_RATE_LIMIT_BACKEND=memory \
            --env FDE_SECRETS_BACKEND=environment \
            --env FDE_MONTH1_PROVIDER=mock \
            --env MOCK_LLM=true \
            fde-mastery-platform:ci
          trap 'docker rm --force fde-mastery-platform-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18000/health && exit 0 || sleep 1; done
          docker logs fde-mastery-platform-ci
          exit 1

  security-static:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Semgrep
        run: semgrep scan --config p/python --config p/security-audit --error --metrics off packages/platform-core/security packages/platform-core/deployment packages/platform-core/integrations packages/platform-core/domains packages/platform-core/custom_agents packages/platform-core/fde_platform
