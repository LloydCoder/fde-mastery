name: Platform Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: month-7-platform
    env:
      PYTHONUNBUFFERED: "1"
      FDE_API_KEYS: test-api-key
      FDE_ADMIN_API_KEYS: test-admin-key
      FDE_STORAGE_BACKEND: memory
      FDE_RATE_LIMIT_BACKEND: memory
      MOCK_LLM: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month-7-platform/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,quality,security,redis]"
      - name: Test
        run: python -m pytest -q
      - name: Ruff
        run: >-
          ruff check deployment persistence shared_orchestrator schemas.py
          --select E4,E7,E9,F
          --ignore E501,F401
      - name: MyPy
        run: mypy deployment persistence shared_orchestrator schemas.py --ignore-missing-imports
      - name: Bandit
        run: bandit -r deployment persistence shared_orchestrator -q
      - name: Dependency audit
        run: pip-audit
