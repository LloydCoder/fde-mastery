name: Platform Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-quality:
    name: Test, Security and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: month-7-platform
    env:
      PYTHONUNBUFFERED: "1"
      FDE_STORAGE_BACKEND: memory
      FDE_RATE_LIMIT_BACKEND: memory
      FDE_MONTH1_PROVIDER: mock
      MOCK_LLM: "true"
      FDE_ENVIRONMENT: test
      OTEL_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month-7-platform/pyproject.toml

      - name: Install platform and CI tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,quality,security,redis,observability,sbom]"
          python -m pip check

      - name: Run test suite
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest.xml

      - name: Verify all six domain adapters
        run: |
          python - <<'PY'
          from shared_orchestrator.router import AgentRouter
          from schemas import Domain

          router = AgentRouter()
          try:
              router.register_defaults()
              expected = {d.value for d in Domain}
              actual = set(router.list_domains())
              assert actual == expected, (actual, expected)
              health = router.health()
              assert all(v["agent"]["status"] == "ready" for v in health.values())
          finally:
              router.close()
          PY

      - name: Run AI security regression suite
        run: |
          python - <<'PY'
          from security.redteam import load_corpus, run_benchmark

          def safe_responder(_prompt: str) -> str:
              return "Request rejected by policy. No protected information or privileged action was provided."

          result = run_benchmark(safe_responder, load_corpus())
          assert result["total"] >= 4, result
          assert result["failed"] == 0, result
          assert result["passed"] is True, result
          PY

      - name: Validate migration sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path("persistence/migrations").glob("[0-9][0-9][0-9]_*.sql"))
          assert files, "No SQL migrations found"
          versions = [int(re.match(r"^(\d{3})_", f.name).group(1)) for f in files]
          assert versions == list(range(1, len(versions) + 1)), versions
          PY

      - name: Ruff
        run: python -m ruff check security persistence shared_orchestrator deployment --select E4,E7,E9,F --ignore E501,F401

      - name: MyPy
        run: python -m mypy security persistence shared_orchestrator --explicit-package-bases --ignore-missing-imports

      - name: Bandit
        run: python -m bandit -r security persistence shared_orchestrator deployment -q

      - name: Dependency audit
        run: python -m pip_audit --skip-editable

      - name: Compile source tree
        run: python -m compileall -q security persistence shared_orchestrator deployment

      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh

      - name: Validate SBOM
        run: |
          test -s artifacts/sbom.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("artifacts/sbom.cdx.json").read_text())
          assert doc.get("bomFormat") == "CycloneDX"
          assert doc.get("components") is not None
          PY

      - name: Upload diagnostics and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-quality-artifacts
          path: |
            month-7-platform/artifacts/pytest.xml
            month-7-platform/artifacts/sbom.cdx.json
          if-no-files-found: warn

      - name: Production Docker build
        run: docker build --tag fde-mastery-platform:ci .
