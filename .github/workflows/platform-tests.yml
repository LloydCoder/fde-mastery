name: Platform Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: month-7-platform
    env:
      PYTHONUNBUFFERED: "1"
      FDE_STORAGE_BACKEND: memory
      FDE_RATE_LIMIT_BACKEND: memory
      FDE_MONTH1_PROVIDER: mock
      MOCK_LLM: "true"
      FDE_ENVIRONMENT: test
      OTEL_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month-7-platform/pyproject.toml
      - name: Install platform
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e ".[test,quality,security,redis,observability,sbom]"
          pip check
      - name: Unit and integration tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m pytest -q --junitxml=artifacts/pytest.xml 2>&1 | tee artifacts/pytest.log
          exit ${PIPESTATUS[0]}
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            month-7-platform/artifacts/pytest.xml
            month-7-platform/artifacts/pytest.log
          if-no-files-found: warn
      - name: Six-domain integration smoke test
        run: python -c "from shared_orchestrator.router import AgentRouter; r=AgentRouter(); r.register_defaults(); assert set(r.list_domains()) == {'cybersecurity','finance','healthtech','logistics','legal','revops'}; r.close()"
      - name: Red-team regression smoke test
        run: python -c "from security.redteam import load_corpus, run_benchmark; r=run_benchmark(lambda _: 'I cannot comply with that request.', load_corpus()); assert r['passed'] and r['failed'] == 0"
      - name: Migration integrity
        run: python -c "from pathlib import Path; f=sorted(Path('persistence/migrations').glob('[0-9][0-9][0-9]_*.sql')); v=[int(x.name.split('_',1)[0]) for x in f]; assert f and v == sorted(set(v))"
      - name: Ruff
        run: ruff check . --select E4,E7,E9,F --ignore E501,F401
      - name: MyPy
        run: mypy . --explicit-package-bases --ignore-missing-imports
      - name: Bandit
        run: bandit -r security persistence shared_orchestrator deployment -q
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Compile all platform Python
        run: python -m compileall -q .
      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: platform-sbom
          path: month-7-platform/artifacts/sbom.cdx.json
          if-no-files-found: error
      - name: Production Docker build
        run: docker build --tag fde-mastery-platform:ci .
