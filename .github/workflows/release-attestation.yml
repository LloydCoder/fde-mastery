name: Release Attestation

on:
  workflow_run:
    workflows: ["Platform Quality"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  attest:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: sigstore/cosign-installer@v3.9.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/fde-mastery-platform:${SHA}"
          docker build -t "$IMAGE" month-7-platform
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Keyless sign image
        run: cosign sign --yes "$IMAGE"
      - name: Generate SBOM and attest
        working-directory: month-7-platform
        run: |
          bash scripts/generate-sbom.sh
          cosign attest --yes --predicate artifacts/sbom.cdx.json --type cyclonedx "$IMAGE"
