name: Release Attestation

on:
  workflow_run:
    workflows: ["Platform Quality"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  attest:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: sigstore/cosign-installer@v3.9.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install SBOM generator
        run: python -m pip install --upgrade pip "cyclonedx-bom>=7.0"
      - name: Build and push immutable image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/fde-mastery-platform:${SHA}"
          docker build -t "$IMAGE" packages/platform-core
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | sed 's/.*@//')"
          test -n "$DIGEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${OWNER}/fde-mastery-platform" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Keyless sign image
        run: cosign sign --yes "$IMAGE"
      - name: Generate SBOM and attest
        working-directory: packages/platform-core
        run: |
          bash scripts/generate-sbom.sh
          cosign attest --yes --predicate artifacts/sbom.cdx.json --type cyclonedx "$IMAGE"
      - name: Generate SLSA build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
