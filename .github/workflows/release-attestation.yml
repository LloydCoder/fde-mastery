name: Release Attestation

on:
  workflow_run:
    workflows: ["Platform Quality"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  attest:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: sigstore/cosign-installer@v3.9.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fde-mastery-platform
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t "$IMAGE:$SHA" month-7-platform
          docker push "$IMAGE:$SHA"
          echo "IMAGE=$IMAGE:$SHA" >> "$GITHUB_ENV"
      - name: Keyless sign image
        run: cosign sign --yes "$IMAGE"
      - name: Generate SBOM and attest
        working-directory: month-7-platform
        run: |
          bash scripts/generate-sbom.sh
          cosign attest --yes --predicate artifacts/sbom.cdx.json --type cyclonedx "$IMAGE"
